name: Probe tiktok.com

# Ek hi sawaal ka jawab: US runner se asli www.tiktok.com scrape hota hai ya nahi.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - name: Probe
        run: npx tsx src/probe.ts
